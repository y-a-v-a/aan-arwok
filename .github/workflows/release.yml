name: Release font

# Manually triggered from the Actions tab. Tags the current commit,
# builds OnKawara-Regular.otf fresh from kawara2.glyphs, and publishes
# it as a GitHub Release asset.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0"
        required: true
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::Tag '${{ inputs.version }}' must look like v1.2 or v1.2.0"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Fail if tag already exists
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ inputs.version }} already exists"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build toolchain
        run: pip install -r requirements.txt

      - name: Build font from source
        run: python tools/build.py

      - name: Name the release asset
        run: cp OnKawara-Regular.otf "OnKawara-Regular-${{ inputs.version }}.otf"

      - name: Create tag and release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: On Kawara ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: OnKawara-Regular-${{ inputs.version }}.otf
