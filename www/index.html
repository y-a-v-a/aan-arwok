<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On Kawara font</title>
  <style>
    @font-face {
      font-family: OnKawara;
      src: url("OnKawara-Regular.otf") format("opentype");
    }
    body {
      /* no default margin: with a 100vh body it adds scrollbars */
      margin: 0;
      height: 100vh;
      background-color: #383838;
      /*background-color: #cd3313;*/
      -webkit-font-smoothing: antialiased;
    }
    .canvas {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-family: OnKawara, Helvetica;
      color: #f1f1f1;
      font-size: 14vw;
      font-weight: normal;
    }
  </style>
  <!--
    Date painting color variants
    white on gray: #f1f1f1 on #383838
    white on red: #e2e2e2 on #cd3838
    white on greenish: #e2e3e4 on #323b3f
  -->
</head>
<body>
  <div class="canvas">
    <div>
      <!-- <h1>APR.29,2019</h1> -->
      <h1 contenteditable>OKT.17,2017</h1>
      <!-- <h1>JAN.18,1976</h1> -->
    </div>
  </div>
</body>
</html>
