<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>On Kawara — kerning workbench</title>
<style>
  @font-face {
    font-family: OnKawara;
    src: url("OnKawara-Regular.otf") format("opentype");
  }
  :root {
    --bg: #383838; --fg: #f1f1f1;
    --panel: #1e1e1e; --panel-fg: #d5d5d5; --accent: #cd3838; --line: #4a4a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    background: var(--panel); color: var(--panel-fg);
    font: 13px/1.45 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  header {
    display: flex; align-items: center; gap: 14px; padding: 8px 14px;
    border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 13px; letter-spacing: .12em; margin: 0; font-weight: 600; }
  header label { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
  .swatch { width: 20px; height: 20px; border-radius: 4px; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .swatch.active { border-color: #fff; }
  select, input[type=text], input[type=number], textarea, button {
    background: #2b2b2b; color: var(--panel-fg); border: 1px solid var(--line);
    border-radius: 4px; padding: 4px 8px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: #888; }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  #status { font-size: 12px; opacity: .85; min-width: 130px; }
  #mode-pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2b2b2b; border: 1px solid var(--line); }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #textbar { padding: 8px 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--line); }
  #sample { flex: 1; resize: vertical; min-height: 30px; white-space: pre; }
  #preview {
    flex: 1; overflow: auto; background: var(--bg); color: var(--fg);
    padding: 40px 30px; cursor: default;
  }
  #preview .line {
    font-family: OnKawara, monospace; font-kerning: none;
    font-feature-settings: "kern" 0, "liga" 0, "calt" 0;
    white-space: pre; line-height: 1.35; width: max-content;
  }
  #preview.native .line { font-kerning: normal; font-feature-settings: "kern" 1; }
  #preview .g { position: relative; }
  #preview:not(.native) .g { cursor: text; }
  .selL { background: rgba(205,56,56,.30); }
  .selR { background: rgba(205,56,56,.30); box-shadow: inset 3px 0 0 var(--accent); }
  #inspector {
    border-top: 1px solid var(--line); padding: 10px 14px;
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap; min-height: 64px;
  }
  #pairname { font-size: 15px; font-weight: 600; min-width: 150px; }
  #pairname small { font-weight: 400; opacity: .7; }
  #inspector .stepper { display: flex; gap: 4px; align-items: center; }
  #kernval { width: 72px; text-align: right; font-size: 15px; }
  #variants { display: flex; gap: 10px; font-size: 12px; }
  #variants span { cursor: pointer; padding: 2px 6px; border-radius: 3px; background: #2b2b2b; }
  #variants span.cur { outline: 1px solid var(--accent); }
  #hint { opacity: .6; font-size: 12px; }
  aside {
    width: 250px; border-left: 1px solid var(--line); display: flex; flex-direction: column;
  }
  aside input { margin: 8px; }
  #pairlist { flex: 1; overflow: auto; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  #pairlist div { display: flex; justify-content: space-between; padding: 2px 12px; cursor: pointer; }
  #pairlist div:hover { background: #2b2b2b; }
  #pairlist div.cur { background: #3a2626; }
  #pairlist .v { opacity: .75; }
  #paircount { padding: 6px 12px; font-size: 11px; opacity: .6; border-top: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>ON KAWARA · KERNING</h1>
  <span id="mode-pill">…</span>
  <label>preset
    <select id="preset">
      <option value="">— sample text —</option>
      <option>OKT.17,2017</option>
      <option>JAN.4,1966</option>
      <option>12 JUNE 2026</option>
      <option>MAY 20, 1981</option>
      <option>WAVERY HAWAIIAN HAVANA PLYWOOD</option>
      <option>DIFFICULT WAFFLES TAWDY YEARLY WATERY</option>
      <option>VANWAYMAN LAVA WHY FLY YONDER</option>
      <option>THE QUICK BROWN FOX, JUMPS OVER THE LAZY DOG.</option>
      <option>0123456789 1965 1933 2026 7.4.1970</option>
      <option>L.A. N.Y. T.T, F.J. P., V., 'M 'D</option>
      <option>AVA TAT LTL OYO WAW KOK RVR PAP</option>
    </select>
  </label>
  <label>size <input type="range" id="size" min="30" max="220" value="110" style="width:110px"></label>
  <span>colours</span>
  <button class="swatch" data-bg="#383838" data-fg="#f1f1f1" style="background:#383838" title="white on gray"></button>
  <button class="swatch" data-bg="#cd3838" data-fg="#e2e2e2" style="background:#cd3838" title="white on red"></button>
  <button class="swatch" data-bg="#323b3f" data-fg="#e2e3e4" style="background:#323b3f" title="white on greenish"></button>
  <label title="lowercase glyphs are copies of the capitals, so keep all four case combinations of a pair in sync">
    <input type="checkbox" id="casesync" checked> sync case
  </label>
  <label title="render with the kerning baked into the OTF instead of the editable values">
    <input type="checkbox" id="native"> font's own kerning
  </label>
  <span style="flex:1"></span>
  <span id="status"></span>
  <button id="save" class="primary">Save</button>
</header>
<main>
  <div id="stage">
    <div id="textbar">
      <textarea id="sample" rows="2" spellcheck="false" autocomplete="off"></textarea>
    </div>
    <div id="preview"></div>
    <div id="inspector">
      <span id="pairname">click between two letters</span>
      <span class="stepper">
        <button data-d="-50">−50</button><button data-d="-10">−10</button><button data-d="-1">−1</button>
        <input type="number" id="kernval" step="1" disabled>
        <button data-d="1">+1</button><button data-d="10">+10</button><button data-d="50">+50</button>
        <button id="settle" title="store an explicit 0 for this pair">= 0</button>
        <button id="zero" title="remove this kerning pair">✕ pair</button>
      </span>
      <span id="variants"></span>
      <span id="hint">←/→ walk pairs · ↑/↓ ±10 · ⇧ ±50 · ⌥ ±1 · ⌥0 settle 0</span>
    </div>
  </div>
  <aside>
    <input type="text" id="filter" placeholder="filter pairs… (e.g. A V)">
    <div id="pairlist"></div>
    <div id="paircount"></div>
  </aside>
</main>

<script src="kerning.js"></script>
<script>
(function () {
  const K = window.KAWARA;
  if (!K) { document.body.innerHTML = "<p style='padding:2em'>kerning.js missing — run <code>make build</code> first.</p>"; return; }
  const kern = K.kerning;                       // {left:{right:val}} — live-edited
  const charToGlyph = {};
  for (const [g, c] of Object.entries(K.glyphToChar)) charToGlyph[c] = g;
  const isLetter = g => /^[A-Za-z]$/.test(g);

  const $ = s => document.querySelector(s);
  const preview = $("#preview"), sample = $("#sample"), status = $("#status");
  let sel = null;          // {left, right, span} current pair
  let dirty = false, live = false, fontVersion = 0;

  // ---------- helpers ----------
  const getKern = (l, r) => (kern[l] && kern[l][r] !== undefined) ? kern[l][r] : null;
  function setKern(l, r, v) {
    const targets = pairTargets(l, r);
    for (const [a, b] of targets) {
      if (v === null) { if (kern[a]) { delete kern[a][b]; if (!Object.keys(kern[a]).length) delete kern[a]; } }
      else { (kern[a] = kern[a] || {})[b] = v; }
    }
    markDirty();
  }
  function pairTargets(l, r) {
    if (!$("#casesync").checked) return [[l, r]];
    const ls = isLetter(l) ? [l.toUpperCase(), l.toLowerCase()] : [l];
    const rs = isLetter(r) ? [r.toUpperCase(), r.toLowerCase()] : [r];
    const out = [];
    for (const a of ls) for (const b of rs) out.push([a, b]);
    return out;
  }
  function markDirty() {
    dirty = true;
    status.textContent = "● unsaved changes";
    renderPairList();
    updateInspector();
    localStorage.kawaraSample = sample.value;
  }

  // ---------- preview ----------
  function renderPreview() {
    preview.innerHTML = "";
    const lines = sample.value.split("\n");
    for (const line of lines) {
      const div = document.createElement("div");
      div.className = "line";
      let prevGlyph = null;
      [...line].forEach(ch => {
        const span = document.createElement("span");
        span.className = "g";
        span.textContent = ch;
        const g = charToGlyph[ch] || null;
        span.dataset.g = g || "";
        if (prevGlyph && g) {
          span.dataset.left = prevGlyph;
          applyMargin(span, prevGlyph, g);
        }
        prevGlyph = g;
        div.appendChild(span);
      });
      preview.appendChild(div);
    }
    reselect();
  }
  function applyMargin(span, l, r) {
    if (preview.classList.contains("native")) { span.style.marginLeft = ""; return; }
    const v = getKern(l, r);
    span.style.marginLeft = v ? (v / K.upm) + "em" : "0";
  }
  function refreshMargins() {
    preview.querySelectorAll(".g").forEach(s => {
      if (s.dataset.left && s.dataset.g) applyMargin(s, s.dataset.left, s.dataset.g);
    });
  }

  // ---------- selection ----------
  function select(span) {
    if (!span || !span.dataset.left || !span.dataset.g) return;
    preview.querySelectorAll(".selL,.selR").forEach(s => s.classList.remove("selL", "selR"));
    span.classList.add("selR");
    if (span.previousElementSibling) span.previousElementSibling.classList.add("selL");
    sel = { left: span.dataset.left, right: span.dataset.g, span };
    updateInspector();
    renderPairList();
  }
  function reselect() {
    if (!sel) return;
    const match = [...preview.querySelectorAll(".g")]
      .find(s => s.dataset.left === sel.left && s.dataset.g === sel.right);
    sel = null;
    if (match) select(match);
    else { updateInspector(); renderPairList(); }
  }
  preview.addEventListener("click", e => {
    if (preview.classList.contains("native")) return;
    const span = e.target.closest(".g");
    if (span) select(span);
  });

  function walk(dir) {
    const spans = [...preview.querySelectorAll(".g")].filter(s => s.dataset.left && s.dataset.g);
    if (!spans.length) return;
    let i = sel ? spans.indexOf(sel.span) : -1;
    i = i === -1 ? 0 : Math.min(spans.length - 1, Math.max(0, i + dir));
    select(spans[i]);
  }

  // ---------- inspector ----------
  function updateInspector() {
    const kv = $("#kernval"), pn = $("#pairname"), variants = $("#variants");
    variants.innerHTML = "";
    if (!sel) { pn.innerHTML = "click between two letters"; kv.value = ""; kv.disabled = true; return; }
    const v = getKern(sel.left, sel.right);
    pn.innerHTML = `${sel.left} <b style="color:var(--accent)">/</b> ${sel.right} <small>${v === null ? "no pair" : ""}</small>`;
    kv.disabled = false;
    kv.value = v === null ? 0 : v;
    if (isLetter(sel.left) && isLetter(sel.right)) {
      for (const [a, b] of [[sel.left.toUpperCase(), sel.right.toUpperCase()],
                            [sel.left.toUpperCase(), sel.right.toLowerCase()],
                            [sel.left.toLowerCase(), sel.right.toUpperCase()],
                            [sel.left.toLowerCase(), sel.right.toLowerCase()]]) {
        const el = document.createElement("span");
        const val = getKern(a, b);
        el.textContent = `${a}${b} ${val === null ? "—" : val}`;
        if (a === sel.left && b === sel.right) el.classList.add("cur");
        el.onclick = () => { sel.left = a; sel.right = b; updateInspector(); };
        variants.appendChild(el);
      }
    }
  }
  function nudge(d) {
    if (!sel) return;
    const v = (getKern(sel.left, sel.right) || 0) + d;
    setKern(sel.left, sel.right, v);
    refreshMargins();
  }
  document.querySelectorAll(".stepper button[data-d]").forEach(b =>
    b.addEventListener("click", () => nudge(+b.dataset.d)));
  $("#kernval").addEventListener("change", e => {
    if (!sel) return;
    const v = parseInt(e.target.value, 10);
    if (!isNaN(v)) { setKern(sel.left, sel.right, v); refreshMargins(); }
  });
  $("#settle").addEventListener("click", () => {
    if (!sel) return;
    setKern(sel.left, sel.right, 0);
    refreshMargins();
  });
  $("#zero").addEventListener("click", () => {
    if (!sel) return;
    setKern(sel.left, sel.right, null);
    refreshMargins();
  });

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
    if (preview.classList.contains("native")) return;
    const step = e.shiftKey ? 50 : e.altKey ? 1 : 10;
    if (e.key === "ArrowLeft") { walk(-1); e.preventDefault(); }
    else if (e.key === "ArrowRight") { walk(1); e.preventDefault(); }
    else if (e.key === "ArrowUp") { nudge(step); e.preventDefault(); }
    else if (e.key === "ArrowDown") { nudge(-step); e.preventDefault(); }
    else if (e.altKey && e.code === "Digit0") {
      if (sel) { setKern(sel.left, sel.right, 0); refreshMargins(); }
      e.preventDefault();
    }
  });

  // ---------- pair list ----------
  function renderPairList() {
    const q = $("#filter").value.trim().split(/\s+/).filter(Boolean);
    const list = $("#pairlist");
    list.innerHTML = "";
    let n = 0, shown = 0;
    for (const l of Object.keys(kern).sort()) {
      for (const r of Object.keys(kern[l]).sort()) {
        n++;
        if (q.length === 1 && !(l.includes(q[0]) || r.includes(q[0]))) continue;
        if (q.length >= 2 && !(l === q[0] && r === q[1])) continue;
        if (shown++ > 600) continue;
        const row = document.createElement("div");
        if (sel && sel.left === l && sel.right === r) row.classList.add("cur");
        row.innerHTML = `<span>${l} ${r}</span><span class="v">${kern[l][r]}</span>`;
        row.onclick = () => {
          const lc = K.glyphToChar[l], rc = K.glyphToChar[r];
          sample.value = `HH${lc}${rc}HH OO${lc}${rc}OO ${lc}${rc}`;
          renderPreview();
          const target = [...preview.querySelectorAll(".g")]
            .find(s => s.dataset.left === l && s.dataset.g === r);
          if (target) select(target);
        };
        list.appendChild(row);
      }
    }
    $("#paircount").textContent = `${n} pairs in table`;
  }
  $("#filter").addEventListener("input", renderPairList);

  // ---------- save ----------
  async function save() {
    if (live) {
      status.textContent = "saving + rebuilding…";
      try {
        const res = await fetch("/api/kerning", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ kerning: kern }),
        });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || res.status);
        dirty = false;
        status.textContent = `saved · ${out.pairs} pairs · font rebuilt`;
        reloadFont();
      } catch (err) {
        status.textContent = "save failed: " + err.message;
      }
    } else {
      const blob = new Blob([JSON.stringify({ kerning: kern }, null, 1)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "kerning.json";
      a.click();
      dirty = false;
      status.textContent = "downloaded — run: make apply FILE=kerning.json";
    }
  }
  $("#save").addEventListener("click", save);
  window.addEventListener("beforeunload", e => { if (dirty) e.preventDefault(); });

  async function reloadFont() {
    fontVersion++;
    const fam = "OnKawara-v" + fontVersion;
    const face = new FontFace(fam, `url(OnKawara-Regular.otf?v=${fontVersion})`);
    await face.load();
    document.fonts.add(face);
    preview.querySelectorAll(".line").forEach(l => l.style.fontFamily = `'${fam}', monospace`);
  }

  // ---------- header controls ----------
  $("#preset").addEventListener("change", e => {
    if (e.target.value) { sample.value = e.target.value; localStorage.kawaraSample = sample.value; renderPreview(); }
    e.target.value = "";
  });
  sample.addEventListener("input", () => { localStorage.kawaraSample = sample.value; renderPreview(); });
  $("#size").addEventListener("input", e => preview.style.fontSize = e.target.value + "px");
  document.querySelectorAll(".swatch").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".swatch").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    preview.style.background = b.dataset.bg;
    preview.style.color = b.dataset.fg;
  }));
  $("#native").addEventListener("change", e => {
    preview.classList.toggle("native", e.target.checked);
    refreshMargins();
    renderPreview();
  });

  // ---------- init ----------
  sample.value = localStorage.kawaraSample || "OKT.17,2017";
  preview.style.fontSize = $("#size").value + "px";
  document.querySelector(".swatch").classList.add("active");
  fetch("/api/status").then(r => r.json()).then(d => { live = !!d.live; })
    .catch(() => { live = false; })
    .finally(() => {
      $("#mode-pill").textContent = live ? "live · saves to kawara2.glyphs" : "static · Save downloads JSON";
    });
  renderPreview();
  renderPairList();
})();
</script>
</body>
</html>
